name: New skill proposal
description: Propose a new skill
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, read the [terminology](../../docs/architecture/terminology.md) and confirm you mean a Skill and not a Spec, Protocol or Rule.
  - type: input
    id: name
    attributes:
      label: Proposed name
      description: Follow the verb-noun formula; see the [naming convention](../../docs/architecture/asset-naming.md)
      placeholder: review-something
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      description: A concrete situation, not a general description of a capability
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Boundary with the existing skills
      description: Why do the existing 55 skills not cover it, and which skills would it sit next to?
    validations:
      required: true
