name: 缺陷报告
description: 报告技能、规则或安装脚本中的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全问题请勿在此提交，见 [SECURITY.md](../../SECURITY.md)。
  - type: input
    id: asset
    attributes:
      label: 涉及资产
      description: 技能 / 规则 / 规范的名称或路径
      placeholder: skills/review-roadmap/SKILL.md
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: Agent 实际做了什么；如有输出请粘贴关键片段
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 使用的 Agent、调用方式、相关的项目状态
    validations:
      required: true
