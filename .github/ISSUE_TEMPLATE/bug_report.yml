name: Bug report
description: Report a problem in a skill, a rule or the install script
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security issue here; see [SECURITY.md](../../SECURITY.md).
  - type: input
    id: asset
    attributes:
      label: Asset involved
      description: The name or path of the skill, rule or spec
      placeholder: skills/review-roadmap/SKILL.md
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What the agent actually did; paste the key part of any output
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Which agent, how it was invoked, and the relevant project state
    validations:
      required: true
