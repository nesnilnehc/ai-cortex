name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    # Blocking since the default rule set was run in full and the repository
    # reached zero findings under both the version pinned below and a newer
    # one. The decisions behind the enabled set, and the exemptions for the
    # records that must not be reformatted, are in .markdownlint.yaml and the
    # nested configurations beside the documents they cover.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: |
            **/*.md
            !.cortex/vendor/**
            !tests/fixtures/**

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: relative links resolve and governance assets do not link down
        # One extractor for both: a link inside a fence or a code span is a
        # demonstration, not a link. scripts/test-markdown-links.py pins that.
        run: python3 scripts/check-markdown-links.py

      - name: orphans, temporary filenames and unlabelled temporary documents
        # rules/doc-health-criteria.md §2, rules/repo-structure-hygiene.md §4
        # and rules/workflow-documentation.md. A body pattern identifies a
        # document as temporary rather than condemning it; the finding is a
        # temporary document that is not labelled as one.
        run: python3 scripts/check-doc-hygiene.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: bin/cortex passes shellcheck
        # bin/cortex is the only executable this repository ships, and the only
        # code here that runs on someone else's machine: it links, prunes and
        # removes paths under $HOME. Every markdown asset had a checker and the
        # installer had none.
        #
        # Blocking from its first run because the script is already clean at the
        # strictest severity, so anything reported later is a regression rather
        # than a backlog to work off. --shell=sh is passed explicitly: the file
        # header declares POSIX sh as a constraint, and reading the shebang
        # would silently relax the check if someone retargeted it at bash.
        #
        # shellcheck is preinstalled on the runner rather than pinned through an
        # action, to avoid taking a third-party action as a dependency for one
        # binary invocation. The version is printed so a verdict that changes
        # with the image is traceable to that, not to the script — which is how
        # the first run was diagnosed: the runner carries 0.9.0, which reports
        # SC2015 on `a && b || true` where 0.11.0 no longer does. The script is
        # now clean under both, so the image may move within that range.
        #
        # add-default-case is the one optional check turned on, because a `case`
        # with no *) arm is how every command here used to swallow a mistyped
        # option: `clean --dryrun` read as no --dry-run and deleted for real.
        # It guards the `case`-based parsers only — install and status take no
        # options and reject their arguments in a plain loop, which no static
        # check can see, so those two are held by review rather than by CI.
        # The rest of the optional set stays off: require-variable-braces alone
        # reports 423 brace-style preferences, which buys no defect.
        run: |
          shellcheck --version
          shellcheck --shell=sh --severity=style --enable=add-default-case bin/cortex

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # check-asset-versions.py diffs against the most recent product tag,
          # and a shallow checkout fetches none.
          fetch-depth: 0

      - name: the prose about bin/cortex matches the script
        # Semantics are a reader's job, but a named subcommand or flag either
        # exists or it does not — and a command nobody documented ships unseen.
        run: python3 scripts/check-cortex-docs.py

      - name: README asset counts match the repository
        # The counts are written by hand in a sentence and again as a table
        # column, so adding a skill leaves both wrong with nothing to notice.
        run: python3 scripts/check-asset-counts.py

      - name: skills registry matches the skills
        # The registry carries the description, tags and triggers AGENTS.md
        # ranks on, so a count check is not enough: it has to agree field by
        # field with the SKILL.md files it registers.
        run: python3 scripts/sync-skills-index.py --check

      - name: required skill frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            grep -q '^name:' "$f" || { echo "missing name: $f"; fail=1; }
            grep -q '^description:' "$f" || { echo "missing description: $f"; fail=1; }
          done
          exit $fail

      - name: skills registry generator
        run: python3 scripts/test-skills-index.py

      - name: research artifact contracts
        run: python3 scripts/test-research-artifacts.py

      - name: modeled Rule contracts
        run: python3 scripts/validate-rules.py

      - name: Rule validator
        # validate-rules.py blocks a merge and, until this test existed,
        # nothing asked whether it could still fail. 27 defect shapes against a
        # fixture pair, plus eight perturbations in mutation-check.py.
        run: python3 scripts/test-validate-rules.py

      - name: findings contract citation
        # specs/findings-list.md owns what a finding carries. Twelve Skills had
        # copied that list into their own prose, so a change to the Spec reached
        # 15 consumers and silently missed 12.
        run: python3 scripts/check-findings-contract.py

      - name: findings contract checker
        run: python3 scripts/test-check-findings-contract.py

      - name: architecture Rule scenarios
        run: python3 scripts/test-rule-scenarios.py

      - name: markdown link checker
        run: python3 scripts/test-markdown-links.py

      - name: document hygiene checker
        run: python3 scripts/test-doc-hygiene.py

      - name: asset count checker
        run: python3 scripts/test-asset-counts.py

      - name: cortex documentation checker
        run: python3 scripts/test-cortex-docs.py

      - name: asset version checker
        run: python3 scripts/test-asset-versions.py

      - name: edited assets moved their versions
        # An asset's version is what a consuming project reads to decide
        # whether to re-read it, so an edited asset whose version is unchanged
        # tells that project something untrue. Needs the tags the job fetches
        # below; with a shallow checkout the check reports NOTHING CHECKED and
        # fails rather than passing on an empty range.
        run: python3 scripts/check-asset-versions.py

      - name: the checks can fail
        # Every check reports a verdict, and a clean verdict proves nothing on
        # its own: a checker that has stopped looking returns the same thing.
        # This perturbs the material each one reads — a defect seeded into a
        # checker, an edit made to a translated document, an unresolvable git
        # ref — and requires the verdict to change.
        run: python3 scripts/mutation-check.py

  translation-invariants:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: language migration invariants
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base"...HEAD -- '*.md' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "no markdown changed"; exit 0; fi
          # Report mode: it does not block an ordinary PR, but it shows the
          # reviewer any structural difference
          python3 scripts/verify-translation.py --mode=rewrite "$base" $files
