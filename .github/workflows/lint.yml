name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    # Blocking since the default rule set was run in full and the repository
    # reached zero findings under both the version pinned below and a newer
    # one. The decisions behind the enabled set, and the exemptions for the
    # records that must not be reformatted, are in .markdownlint.yaml and the
    # nested configurations beside the documents they cover.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: |
            **/*.md
            !.cortex/vendor/**
            !tests/fixtures/**

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: check relative links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in pathlib.Path(".").rglob("*.md"):
              if ".git/" in str(f):
                  continue
              lines = f.read_text(encoding="utf-8").split("\n")
              fence = False
              for i, l in enumerate(lines):
                  if l.startswith("```"):
                      fence = not fence
                      continue
                  if fence:
                      continue
                  for m in re.finditer(r'\]\(((?!https?://|#|mailto:)[^)]+)\)', l):
                      t = m.group(1).split("#")[0]
                      if t and not (f.parent / t).resolve().exists():
                          bad.append(f"{f}:{i+1} -> {t}")
          print(f"broken: {len(bad)}")
          for b in bad:
              print(" ", b)
          # No exemption by directory. An ADR that mentions an asset since
          # deleted names it as text, not as a link, so the record stays
          # truthful without leaving a dead edge in the link graph.
          if bad:
              sys.exit(1)
          PY

      - name: orphaned documents and temporary filenames
        # rules/doc-health-criteria.md §2 and rules/repo-structure-hygiene.md
        # §4. Only what a path and a link graph can prove; whether a document
        # is semantically stale still needs a reader.
        run: python3 scripts/check-doc-hygiene.py

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: skills registry matches the skills
        # The registry carries the description, tags and triggers AGENTS.md
        # ranks on, so a count check is not enough: it has to agree field by
        # field with the SKILL.md files it registers.
        run: python3 scripts/sync-skills-index.py --check

      - name: required skill frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            grep -q '^name:' "$f" || { echo "missing name: $f"; fail=1; }
            grep -q '^description:' "$f" || { echo "missing description: $f"; fail=1; }
          done
          exit $fail

      - name: reference direction between layers
        # docs/architecture/terminology.md §II: a Spec, Protocol or Rule names
        # the capability that applies it and never links down into skills/.
        run: |
          if grep -rnoE '\]\((\.\./)*skills/[^)]*\)' rules specs protocols --include='*.md'; then
            echo "a Spec, Protocol or Rule must not link into skills/ — name the capability instead"
            exit 1
          fi
          echo "no governance asset links into skills/"

      - name: skills registry generator
        run: python3 scripts/test-skills-index.py

      - name: research artifact contracts
        run: python3 scripts/test-research-artifacts.py

      - name: modeled Rule contracts
        run: python3 scripts/validate-rules.py

      - name: architecture Rule scenarios
        run: python3 scripts/test-rule-scenarios.py

  translation-invariants:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: language migration invariants
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base"...HEAD -- '*.md' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "no markdown changed"; exit 0; fi
          # Report mode: it does not block an ordinary PR, but it shows the
          # reviewer any structural difference
          python3 scripts/verify-translation.py --mode=rewrite "$base" $files
