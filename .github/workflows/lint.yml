name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    # Advisory for now. The repository has been cleaned against MD009/012/022/
    # 031/040/047, but markdownlint's default set is far larger and has never
    # been run in full in CI. Collect the real violations first, then enforce.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: |
            **/*.md
            !.cortex/vendor/**

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: check relative links
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in pathlib.Path(".").rglob("*.md"):
              if ".git/" in str(f):
                  continue
              lines = f.read_text(encoding="utf-8").split("\n")
              fence = False
              for i, l in enumerate(lines):
                  if l.startswith("```"):
                      fence = not fence
                      continue
                  if fence:
                      continue
                  for m in re.finditer(r'\]\(((?!https?://|#|mailto:)[^)]+)\)', l):
                      t = m.group(1).split("#")[0]
                      if t and not (f.parent / t).resolve().exists():
                          bad.append(f"{f}:{i+1} -> {t}")
          known = sum(1 for b in bad if "/docs/adr/" in b)
          print(f"broken: {len(bad)} (historical ADR refs: {known})")
          for b in bad:
              print(" ", b)
          # References in older ADRs to assets since deleted are kept on
          # purpose and do not count as failures
          if len(bad) - known:
              sys.exit(1)
          PY

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: INDEX matches the directories
        run: |
          s=$(ls -d skills/*/ | wc -l)
          i=$(grep -c '^- \[' skills/INDEX.md)
          echo "skills dirs: $s / INDEX entries: $i"
          [ "$s" = "$i" ] || { echo "skills/INDEX.md and skills/ disagree on the count"; exit 1; }

      - name: required skill frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            grep -q '^name:' "$f" || { echo "missing name: $f"; fail=1; }
            grep -q '^description:' "$f" || { echo "missing description: $f"; fail=1; }
          done
          exit $fail

  translation-invariants:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: language migration invariants
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files=$(git diff --name-only "$base"...HEAD -- '*.md' | tr '\n' ' ')
          if [ -z "$files" ]; then echo "no markdown changed"; exit 0; fi
          # Report mode: it does not block an ordinary PR, but it shows the
          # reviewer any structural difference
          python3 scripts/verify-translation.py --mode=rewrite "$base" $files

