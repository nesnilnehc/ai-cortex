# NATS consumer project cache
# Read by the consume-nats-message skill; any field can be overridden by a
# user parameter at call time

broker_url: nats://localhost:4222

# This service's identity as a consumer, written to the X-Source header of a
# DLQ message
service_source: ai-cortex

# Durable consumer name prefix; the full name is <prefix>-<event-slug>
durable_name_prefix: cortex

# An unrecoverable message (term) has its DLQ delivery logged in this directory
dlq_handler_dir: .cortex/dlq

# Where vendored producer contracts live, as <producer>/<event>-contract.md
vendor_contracts_dir: .cortex/vendor/contracts

# Consumption defaults, overridable at call time
consume_defaults:
  max_messages: 200      # most messages handled in one drain
  batch_size: 20         # messages pulled per fetch
  fetch_timeout: 5000    # per-fetch wait timeout, in milliseconds
  idle_threshold: 15000  # consecutive empty fetches beyond this many ms means drained
