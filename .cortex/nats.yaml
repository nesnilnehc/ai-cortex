# NATS project cache
# Read by the publish-nats-message skill; any field can be overridden by a
# user parameter at call time.
#
# This repository publishes and does not consume. The inbound proposal channel
# and its receive-side settings were retired — see the CHANGELOG.

broker_url: nats://localhost:4222

# This service's identity, written to the X-Source header of every message
service_source: ai-cortex

# JetStream stream this repository publishes into (IaC-managed elsewhere)
default_stream: CORTEX

# Where this repository's own outbound contracts live
contract_dir: .cortex/contracts
