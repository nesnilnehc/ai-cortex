change_items:
- id: CI-0500-roadmap
  kind: breaking
  summary: Plan requirements and defects by priority and readiness with optional delivery
    views.
  user_impact: Consumers re-read roadmap obligations and preserve existing decisions
    when adopting views.
  sources:
  - d5c67ba2987639dbbf901dc6af44230c7dd45029
  - 7c34aa350239d855e257e759a3260dd09e386b77
  - 887258c7b543932c976443cb1b528c2224e0edb0
  - b0f55966bd6473a9dc1edf7f15b8e72fb4c31266
  audiences:
  - technical
  - customer
  migration: 'See release-notes.md: Upgrade notes'
- id: CI-0500-roadmap-stages
  kind: feature
  summary: Separate structure and content planning; align existing projects in place.
  user_impact: Teams can inspect a blank structure before business population without
    forced migrations.
  sources:
  - d6c725d1cdbcd5dd04076ce42158a80cbd891a24
  - f5f6d6b38384736c164a1acc1f4e1436198c9e36
  audiences:
  - technical
  - customer
  migration:
- id: CI-0500-roadmap-language
  kind: feature
  summary: Resolve deliverable language from project evidence and support en/zh-CN
    catalogs.
  user_impact: Roadmap maintenance retains language; legacy generator inputs keep
    English output.
  sources:
  - 9203170353c9a63710a1a5060ca061456ad506a3
  audiences:
  - technical
  - customer
  migration:
- id: CI-0500-roadmap-platform
  kind: feature
  summary: Define remote roadmap authority and integrity/recovery/migration checks.
  user_impact: Knowledge-base delivery preserves facts and distinguishes stored data
    from reader verification.
  sources:
  - b5fddd8e240df1565ffddc55ff30889f459ca8e8
  audiences:
  - technical
  - customer
  migration:
- id: CI-0500-roadmap-output-safety
  kind: fix
  summary: Reject hardlinked outputs and validate captured HTML anchors.
  user_impact: Generation cannot silently mutate a hardlinked destination and source
    checks understand HTML anchors.
  sources:
  - 6493819c0729ecdb7997eccc8c070b23e0423dfe
  audiences:
  - technical
  - customer
  migration:
- id: CI-0500-governance-routing
  kind: breaking
  summary: Use explicit decision states, route-scoped prerequisites and exact recommendation
    exclusions.
  user_impact: Routing consumers must distinguish non-actionable states from completion
    and executor continuation.
  sources:
  - 6849920a25a6a36396ab83e7f543af0673bc1003
  - 218aad429712d9632c0bbfd097a6a494d392c309
  audiences:
  - technical
  - customer
  migration: 'See release-notes.md: Upgrade notes'
- id: CI-0500-skill-discovery
  kind: breaking
  summary: Remove inactive discovery metadata and use English descriptions plus local
    references.
  user_impact: Custom integrations must stop depending on removed fields or substring
    trigger ranking.
  sources:
  - b1e3e16422b787cd91f5deeb75a69930344a4ea2
  audiences:
  - technical
  - customer
  migration: 'See release-notes.md: Upgrade notes'
- id: CI-0500-requirements
  kind: breaking
  summary: Define requirement section order, readiness and a bounded review/repair
    loop.
  user_impact: Editable drafts follow the new contract; frozen snapshots retain history
    and use successor revisions.
  sources:
  - b0b32d0231263f0cb24fea8e3f611c1ab214da8b
  audiences:
  - technical
  - customer
  migration: 'See release-notes.md: Upgrade notes'
- id: CI-0500-ui-decisions
  kind: breaking
  summary: Require UI decision records for new interfaces and significant experience
    changes.
  user_impact: Adopters add their own loading entry and verify responsive, keyboard
    and real interaction outcomes.
  sources:
  - eee2e408e989a60507ecf17fa724c1a8ed461839
  - 03d469008906cf6baf4b968f137355f2a63b3f7a
  audiences:
  - technical
  - customer
  migration: 'See release-notes.md: Upgrade notes'
- id: CI-0500-presales
  kind: feature
  summary: Add grounded presales response preparation with product/customer evidence
    boundaries.
  user_impact: Users prepare answers and chosen customer files without implied sending
    or contract authority.
  sources:
  - be1c2b91ff306f028fead4f60562083d7f3fae8c
  audiences:
  - technical
  - customer
  migration:
- id: CI-0500-verification
  kind: improvement
  summary: Require actual execution evidence and refine test-objective and documentation
    criteria.
  user_impact: Empty, all-skipped or unverified required checks block release readiness.
  sources:
  - 5435884aefb799c2039c210f027e7853d060226a
  - e4ed7e522a5093fa471fc362d1cf09afeac76a38
  audiences:
  - technical
  - customer
  migration:
- id: CI-0500-local-asset-guidance
  kind: improvement
  summary: Refine asset boundaries, research examples and tool-capability-aware NATS
    publication.
  user_impact: Skills preserve local provenance, preserve QoS and report missing capabilities.
  sources:
  - b1e3e16422b787cd91f5deeb75a69930344a4ea2
  audiences:
  - technical
  - customer
  migration:
- id: CI-0500-website-brand
  kind: feature
  summary: Publish a bilingual capability atlas and shared Cortex core mark.
  user_impact: Visitors explore assets on site and retain language/theme preferences.
  sources:
  - 9d849610860ebbc5b5320da1e3bcfa185e79099e
  - bcc57a2af9fddd897265fff0f4a8a4e852516a0d
  - 983ddedc731ab43e5d2f4bdacded0e2029a1130f
  - 0cecbc8201414065a33f5115ad1e85ae952f6767
  - d1f0ed5ef000a2056ae5565c1dbc7a10685b6167
  - e80c7a704bd685592d9119de3d5f6ccb8e76ba89
  audiences:
  - technical
  - customer
  migration:
