<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-labelledby="title description"><title id="title">Assisted Triage Pilot schedule</title><desc id="description">W1 begins at this fictional project start; calendar start unknown.; target, committed and actual timing are labeled; exclusive ends.</desc><style>text{font:14px sans-serif;fill:#172b4d} .grid{stroke:#d9e2ec;stroke-width:1}.span{fill:#3579ad}.milestone{fill:#3579ad}.dependency{fill:none;stroke:#526777;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff" /><text x="20" y="28">Assisted Triage Pilot</text><text x="20" y="51">W1 begins at this fictional project start; calendar start unknown.</text><text x="20" y="100">Reference / timing basis</text><text x="350" y="100">Relative weeks</text><line x1="350.0" y1="128" x2="350.0" y2="304" class="grid" /><text x="350.0" y="121" text-anchor="middle">W1</text><line x1="630.0" y1="128" x2="630.0" y2="304" class="grid" /><text x="630.0" y="121" text-anchor="middle">W2</text><line x1="910.0" y1="128" x2="910.0" y2="304" class="grid" /><text x="910.0" y="121" text-anchor="middle">W3</text><text x="20" y="156">PH1 · Learning pilot</text><text x="20" y="198">target · W1–W2</text><rect x="350.0" y="156" width="560.0" height="18" class="span"><title>PH1 · Learning pilot · W1–W2</title></rect><text x="20" y="240">MS1 · Pilot evidence revie</text><text x="20" y="257">wed</text><text x="20" y="282">target · W3 · planned</text><polygon points="910.0,240 917.0,249 910.0,258 903.0,249" class="milestone"><title>MS1 · Pilot evidence reviewed · W3</title></polygon><path d="M 910.0 165 L 918.0 165 L 918.0 232 L 910.0 232 L 910.0 240" class="dependency" /><polygon points="910.0,240 906.0,234 914.0,234" fill="#526777" /><text x="20" y="329">Bars show elapsed time, not completion percentage.</text></svg>
