<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268" role="img" aria-labelledby="title description"><title id="title">Assisted Triage Pilot schedule</title><desc id="description">W1 begins at this fictional project start; calendar start unknown.; target, committed and actual timing are labeled; exclusive ends.</desc><style>text{font:14px sans-serif;fill:#172b4d} .grid{stroke:#d9e2ec;stroke-width:1}.span{fill:#3579ad}.milestone{fill:#3579ad}.dependency{fill:none;stroke:#526777;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff" /><text x="20" y="28">Assisted Triage Pilot</text><text x="20" y="51">W1 begins at this fictional project start; calendar start unknown.</text><text x="20" y="100">Reference / timing basis</text><text x="350" y="100">Relative weeks</text><line x1="350.0" y1="128" x2="350.0" y2="220" class="grid" /><text x="350.0" y="121" text-anchor="middle">W3</text><line x1="910.0" y1="128" x2="910.0" y2="220" class="grid" /><text x="910.0" y="121" text-anchor="middle">W4</text><text x="20" y="156">MS1 · Pilot evidence revie</text><text x="20" y="173">wed</text><text x="20" y="198">target · W3 · planned</text><polygon points="350.0,156 357.0,165 350.0,174 343.0,165" class="milestone"><title>MS1 · Pilot evidence reviewed · W3</title></polygon><text x="20" y="245">Bars show elapsed time, not completion percentage.</text></svg>
