 users to follo</text><text x="20" y="341">w up on requests</text><text x="20" y="366">target · Unscheduled</text><text x="362" y="336">Unscheduled</text><text x="20" y="408">M0 · Project kickoff</text><text x="20" y="450">target · W1 · planned</text><polygon points="350.0,408 357.0,417 350.0,426 343.0,417" class="milestone"><title>M0 · Project kickoff · W1</title></polygon><text x="20" y="492">M1 · Repair acceptance</text><text x="20" y="534">target · W2 · planned</text><polygon points="490.0,492 497.0,501 490.0,510 483.0,501" class="milestone"><title>M1 · Repair acceptance · W2</title></polygon><text x="20" y="576">M2 · Search acceptance</text><text x="20" y="618">target · W3 · planned</text><polygon points="630.0,576 637.0,585 630.0,594 623.0,585" class="milestone"><title>M2 · Search acceptance · W3</title></polygon><text x="20" y="660">M3 · Search production rel</text><text x="20" y="677">ease</text><text x="20" y="702">target · W3 · planned</text><polygon points="630.0,660 637.0,669 630.0,678 623.0,669" class="milestone"><title>M3 · Search production release · W3</title></polygon><path d="M 630.0 585 L 638.0 585 L 638.0 652 L 630.0 652 L 630.0 660" class="dependency" /><polygon points="630.0,660 626.0,654 634.0,654" fill="#526777" /><text x="20" y="749">Bars show elapsed time, not completion percentage.</text></svg>
