interface:
  display_name: "Inspect Artifact State"
  short_description: "Inspect artifacts and recorded source revisions"
  default_prompt: "Use $inspect-artifact-state to inspect artifacts read-only through their bound repository access and attempt to collect recorded source repositories and commits. Summarize in natural prose; when preparing a later version or release-scope comparison, explicitly include artifact identity/digest, full recorded source commits, association evidence and gaps without choosing a baseline or comparing Git history."
